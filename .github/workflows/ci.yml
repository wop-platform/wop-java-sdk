name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 02:00 UTC 跑 mutation（低频收集 PIT 基线）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build, test and enforce coverage gate (line+branch = 100%)
        run: mvn -B -ntp verify
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports-${{ matrix.os }}
          path: '**/target/site/jacoco/'
          if-no-files-found: error

  # PIT 变异测试：本机 macOS/arm64 minion 崩溃（docs/mutation-report.md §3），
  # 在 CI 标准环境验证；稳定后收紧门槛并替代手工脚本（scripts/mutation-check.py 退役）。
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: PIT mutation coverage (wop-sdk-core)
        run: mvn -B -ntp -pl wop-sdk-core test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-reports
          path: 'wop-sdk-core/target/pit-reports/'
          if-no-files-found: warn

  # 变异点快照漂移检测（wop-specs D7：PR 级秒级防线；完整变异跑见 mutation job
  # 定期档 / scripts/mutation-check.py 手动档）。
  equivalent-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/check-equivalent-anchors.py
