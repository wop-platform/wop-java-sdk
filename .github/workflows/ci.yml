name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 02:00 UTC 跑 mutation（低频收集 PIT 基线）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ['8', '21', '25']
        include:
          # Temurin 不发布 macOS aarch64 JDK 8（setup-java 报 No matching version
          # found for SemVer '8'）；java 8 档改用 Zulu，21/25 档保持 Temurin
          - java: '8'
            distribution: zulu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution || 'temurin' }}
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test and enforce coverage gate (line+branch = 100%)
        if: matrix.java == '21'
        run: mvn -B -ntp verify
      # 8/25 档只验证编译+测试（覆盖率与 JaCoCo 门禁在 21 档执行）；
      # wop-sdk-unirest 依赖 unirest-java-core 4.x（字节码 Java 11+），其 pom profile 在 JDK<11 自动跳过测试
      - name: Build and test
        if: matrix.java != '21'
        run: mvn -B -ntp test -Djacoco.skip=true
      - name: Upload coverage reports
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: '**/target/site/jacoco/'
          if-no-files-found: error

  # PIT 变异测试：本机 macOS/arm64 minion 崩溃（docs/mutation-report.md §3），
  # 在 CI 标准环境验证；稳定后收紧门槛并替代手工脚本（scripts/mutation-check.py 退役）。
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: PIT mutation coverage (wop-sdk-core)
        run: mvn -B -ntp -pl wop-sdk-core test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-reports
          path: 'wop-sdk-core/target/pit-reports/'
          if-no-files-found: warn

  # 变异点快照漂移检测（wop-specs D7：PR 级秒级防线；完整变异跑见 mutation job
  # 定期档 / scripts/mutation-check.py 手动档）。
  equivalent-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/check-equivalent-anchors.py
